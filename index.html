<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Research Desk</span>
      </div>

      <button id="newChat" class="btn btn-primary" type="button">New research</button>

      <nav id="history" class="history" aria-label="Past chats"></nav>

      <div class="sidebar-foot">
        <button id="settingsBtn" class="btn-link" type="button">Server settings</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open chat history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="chatTitle">New research</h1>
        <span class="status" id="status"><i class="dot"></i><span id="statusText">Ready</span></span>
      </header>

      <section class="stream" id="stream" aria-live="polite">
        <div class="stream-inner" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <form id="composer" class="composer" autocomplete="off">
          <textarea
            id="input"
            rows="1"
            placeholder="Ask a question, or ask for research to be emailed"
            aria-label="Message"
          ></textarea>
          <button id="sendBtn" class="send" type="submit" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
        <p class="hint" id="hint">Emails are held for your approval before anything is sent.</p>
      </footer>
    </main>
  </div>

  <!-- Settings dialog -->
  <dialog id="settings" class="dialog">
    <form method="dialog" id="settingsForm">
      <h2>Server settings</h2>
      <label for="apiUrl">Backend URL</label>
      <input id="apiUrl" type="url" placeholder="http://127.0.0.1:8000" required />
      <p class="dialog-note">The address where your FastAPI app is running.</p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel" type="submit" formnovalidate>Cancel</button>
        <button class="btn btn-primary" id="saveSettings" value="save" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
